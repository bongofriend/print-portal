# Only reachable from inside the pod (the portal container shares localhost).
LogLevel warn
MaxLogSize 0
Listen localhost:631
Listen /run/cups/cups.sock
WebInterface No
Browsing No
DefaultAuthType Basic
PreserveJobHistory 1d
MaxJobs 500

<Location />
  Order allow,deny
  Allow localhost
</Location>
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  # Everything inside the pod is the portal, which is trusted: allow it to
  # submit, list and cancel any job without CUPS-level authentication.
  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document CUPS-Get-Document Cancel-Job Cancel-My-Jobs Get-Jobs Get-Job-Attributes Hold-Job Release-Job Restart-Job Close-Job>
    Order deny,allow
  </Limit>
  # Queue administration only from root over the local socket (the entrypoint).
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default Pause-Printer Resume-Printer Enable-Printer Disable-Printer Purge-Jobs Cancel-Jobs Set-Printer-Attributes>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
